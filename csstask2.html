<style>
    /* Vertical Navigation Bar */
    .vertical-nav {
      list-style-type: none;
      margin: 0;
      padding: 0;
      width: 200px;
      background-color: #f1f1f1;
    }
    
    .vertical-nav li a {
      display: block;
      color: #000;
      padding: 8px 16px;
      text-decoration: none;
    }
    
    .vertical-nav li a:hover {
      background-color: #4CAF50;
      color: white;
    }
    
    /* Horizontal Navigation Bar */
    .horizontal-nav {
      list-style-type: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f1f1f1;
    }
    
    .horizontal-nav li {
      float: left;
    }
    
    .horizontal-nav li a {
      display: block;
      color: #000;
      text-align: center;
      padding: 14px 16px;
      text-decoration: none;
    }
    
    .horizontal-nav li a:hover {
      background-color: #4CAF50;
      color: white;
    }
    </style>
